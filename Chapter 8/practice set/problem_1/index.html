<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .btn1{
            margin: auto;
            background-color: red;
            color: white;
            padding: 9px;
            border: 2px solid cyan;
            border-radius: 10px;
        }
        .btn2{
            border-radius: 8px;
            margin: auto;
            background-color: green;
            color: white;
            padding: 9px;
            border: 2px solid cyan;
        }
        .btn3{
            border-radius: 9px;
            margin: auto;
            background-color: blue;
            color: white;
            padding: 9px;
            border: 2px solid cyan;
        }
    </style>
</head>
<body>
    <button class="btn1">red button</button>
    <button class="btn2">green button</button>
    <button class="btn3">blue button</button>
    <script src="script.js"></script>
</body>
</html>
