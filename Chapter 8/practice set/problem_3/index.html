<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        .btn1{
            background-color: white;
            color: purple;
            border: 2px solid rgb(233, 11, 233);
            border-radius: 10px;
            padding: 6px;

        }

        .btn2{
            background-color: white;
            color: red;
            border: 2px solid red;
            border-radius: 10px;
            padding: 6px;

        }

        .btn3{
            background-color: white;
            color: blue;
            border: 2px solid blue;
            border-radius: 10px;
            padding: 6px;

        }
        .btn1:hover{
            background-color: purple;
            color: white;
        }
        .btn2:hover{
            background-color: red;
            color: white;
        }
        .btn3:hover{
            background-color: blue;
            color: white;
        }
    </style>
</head>

<body>
    <button class="btn1">Google</button>
    <button class="btn2">Youtube</button>
    <button class="btn3">Facebook</button>
    <script src="script.js"></script>
</body>

</html>
